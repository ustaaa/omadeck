name: OmaDeck checks

on:
  push:
    branches: [main, pilot]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the validated font pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
          path: craft-fonts
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libasound2-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers desktop-file-utils appstream
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.95.0 wasm32-unknown-unknown
      - name: Upstream quality gates
        run: |
          umask 022
          cargo +1.95.0 xtask ci
      - name: Lockfile stayed reproducible
        run: git diff --exit-code -- Cargo.lock
      - name: Build isolated native binaries
        run: |
          umask 022
          cargo +1.95.0 build --release --locked -p deckcraft -p deckcraft-cli
      - name: Package local tarball (no publishing)
        run: packaging/linux/package.sh --skip-build --formats tar
